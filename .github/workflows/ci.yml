name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.9"
      - name: Install dependencies
        run: npm install
      - name: Run linter
        run: npm run lint
      - name: Check formatting
        run: npx prettier --check .
